<svg fill="none" width="850" height="200" viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Accent Lines Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/>
    </pattern>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="200" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="850" height="200" rx="16" fill="url(#dots)"/>

  <!-- Top Line Accent -->
  <rect x="0" y="0" width="850" height="3" rx="1.5" fill="url(#neonGrad)"/>

  <!-- Side Decorative Glow Bars -->
  <rect x="35" y="45" width="4" height="110" rx="2" fill="url(#neonGrad)" filter="url(#glow)"/>

  <!-- Main Content Group -->
  <g transform="translate(60, 48)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="22" rx="11" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="12" cy="11" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
      COMPUTER ENGINEERING STUDENT • FULL-STACK
    </text>

    <!-- Main Title -->
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Kishan Vadsola
    </text>

    <!-- Subtitle -->
    <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="url(#neonGrad)">
      Full-Stack Developer • Problem Solver • Tech Enthusiast
    </text>

    <!-- Tagline -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Building high-performance software, Web applications &amp; algorithmic utilities.
    </text>
  </g>

  <!-- Right Decorative Tech Grid Accent -->
  <g transform="translate(640, 45)">
    <rect x="0" y="0" width="170" height="110" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="28" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">&gt; Core Stack</text>
    <text x="16" y="50" font-family="monospace" font-size="11" fill="#cbd5e1">• C++ / Python</text>
    <text x="16" y="68" font-family="monospace" font-size="11" fill="#cbd5e1">• JS / TypeScript</text>
    <text x="16" y="86" font-family="monospace" font-size="11" fill="#cbd5e1">• React / Node.js</text>
  </g>

  <!-- Bottom Subtle Line -->
  <line x1="35" y1="199" x2="815" y2="199" stroke="url(#neonGrad)" stroke-width="1" opacity="0.3"/>
</svg>
