<svg fill="none" width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Gradient Cyan-Blue -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="220" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="850" height="220" rx="16" fill="url(#grid)"/>

  <!-- Decorative Glowing Orbs -->
  <circle cx="750" cy="40" r="90" fill="#7f00ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="100" cy="180" r="70" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>
  <circle cx="425" cy="110" r="110" fill="#3b82f6" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="850" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Code Bracket Motif Left -->
  <g transform="translate(45, 60)" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <path d="M 25 10 L 10 30 L 25 50" />
    <path d="M 45 10 L 60 30 L 45 50" opacity="0.5"/>
    <line x1="38" y1="12" x2="30" y2="48" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Header Content -->
  <g transform="translate(130, 75)">
    <!-- Subtitle / Tagline Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
      AVAILABLE FOR PROJECTS
    </text>

    <!-- Main Title -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5" filter="url(#subtleGlow)">
      Kishan Vadsola
    </text>

    <!-- Subheader / Description -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">
      Software Developer &amp; Tech Enthusiast
    </text>
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Crafting robust solutions with C++, Python, JavaScript &amp; TypeScript
    </text>
  </g>

  <!-- Right Side Decorative Tech Pill Badges -->
  <g transform="translate(640, 55)">
    <!-- C++ Badge -->
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1"/>
    <text x="16" y="21" font-family="monospace" font-size="13" font-weight="700" fill="#a5b4fc">C++ / Algorithms</text>

    <!-- Python & Web Badge -->
    <rect x="0" y="44" width="150" height="32" rx="8" fill="#0f2942" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="65" font-family="monospace" font-size="13" font-weight="700" fill="#7dd3fc">Python &amp; JS / TS</text>

    <!-- Full Stack Badge -->
    <rect x="0" y="88" width="150" height="32" rx="8" fill="#142e2b" fill-opacity="0.6" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="109" font-family="monospace" font-size="13" font-weight="700" fill="#6ee7b7">Web Development</text>
  </g>

  <!-- Bottom Subtle Line -->
  <line x1="40" y1="219" x2="810" y2="219" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>
</svg>
